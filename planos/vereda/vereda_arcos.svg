<text x="1060.0" y="452" font-size="12" font-weight="700">SUPUESTOS (confirmar antes de armar):</text>
<text x="1060.0" y="470" font-size="12" font-weight="400">- Vereda existente de 4' 0" de ancho.</text>
<text x="1060.0" y="488" font-size="12" font-weight="400">- Su borde izquierdo cae en el centro</text>
<text x="1060.0" y="506" font-size="12" font-weight="400">  de la escalera (mirando desde la escalera).</text>
<text x="1060.0" y="524" font-size="12" font-weight="400"></text>
<text x="1060.0" y="542" font-size="12" font-weight="700">CÓMO SE DIBUJA CADA ARCO:</text>
<text x="1060.0" y="560" font-size="12" font-weight="400">- Cuarto de elipse. Centro: 8' afuera del</text>
<text x="1060.0" y="578" font-size="12" font-weight="400">  escalón, en línea con la punta del escalón.</text>
<text x="1060.0" y="596" font-size="12" font-weight="400">- Sale pegado (tangente) al escalón y</text>
<text x="1060.0" y="614" font-size="12" font-weight="400">  llega derecho al borde de la vereda.</text>
<text x="1060.0" y="632" font-size="12" font-weight="400">- Clavar estacas en los puntos de la tabla</text>
<text x="1060.0" y="650" font-size="12" font-weight="400">  y doblar la tabla/flex (masonite) por ellos.</text>
<text x="130" y="40" font-size="24" font-weight="700" font-family="Cinzel, serif">VEREDA CON ARCOS ELÍPTICOS — PLANTA</text>
<text x="130" y="64" font-size="13">MOP Construction · 27-oct-2026 · medidas en pies y pulgadas · sin escala para presupuesto</text>
