<text x="1060.0" y="593" font-size="12" font-weight="700">SUPUESTOS (confirmar antes de armar):</text>
<text x="1060.0" y="611" font-size="12" font-weight="400">- Vereda existente 4' 1 1/2" (medida).</text>
<text x="1060.0" y="629" font-size="12" font-weight="400">- Su borde izquierdo cae en el centro</text>
<text x="1060.0" y="647" font-size="12" font-weight="400">  de la escalera (mirando desde la escalera).</text>
<text x="1060.0" y="665" font-size="12" font-weight="400"></text>
<text x="1060.0" y="683" font-size="12" font-weight="700">CÓMO ES CADA LADO (curva en S):</text>
<text x="1060.0" y="701" font-size="12" font-weight="400">- Arco 1 hacia afuera: sale derecho de la</text>
<text x="1060.0" y="719" font-size="12" font-weight="400">  punta del escalón. Centro en la línea del</text>
<text x="1060.0" y="737" font-size="12" font-weight="400">  escalón (CA1, CB1).</text>
<text x="1060.0" y="755" font-size="12" font-weight="400">- Arco 2 hacia adentro: llega derecho al</text>
<text x="1060.0" y="773" font-size="12" font-weight="400">  borde de la vereda. Centro en la línea de</text>
<text x="1060.0" y="791" font-size="12" font-weight="400">  la vereda vieja (CA2, CB2).</text>
<text x="1060.0" y="809" font-size="12" font-weight="400">- Se unen a 4' 0" del escalón, a mitad</text>
<text x="1060.0" y="827" font-size="12" font-weight="400">  de camino, sin quiebre.</text>
