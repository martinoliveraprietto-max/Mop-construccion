<text x="1060.0" y="665" font-size="12" font-weight="400"></text>
<text x="1060.0" y="683" font-size="12" font-weight="700">CÓMO ES CADA LADO (curva en S):</text>
<text x="1060.0" y="701" font-size="12" font-weight="400">- Arco 1 hacia afuera: sale derecho de la</text>
<text x="1060.0" y="719" font-size="12" font-weight="400">  punta del escalón. Centro sobre la línea</text>
<text x="1060.0" y="737" font-size="12" font-weight="400">  del escalón (CA1, CB1).</text>
<text x="1060.0" y="755" font-size="12" font-weight="400">- Arco 2 hacia adentro: llega derecho al</text>
<text x="1060.0" y="773" font-size="12" font-weight="400">  borde de la vereda. Centro sobre la línea</text>
<text x="1060.0" y="791" font-size="12" font-weight="400">  de la vereda vieja (CA2, CB2).</text>
<text x="1060.0" y="809" font-size="12" font-weight="400">- Se cruzan en diagonal a 5' 0" del</text>
<text x="1060.0" y="827" font-size="12" font-weight="400">  escalón: la curva no se aplana ni quiebra.</text>
<text x="1060.0" y="845" font-size="12" font-weight="400">- Clavar estacas en los puntos (o) de la tabla</text>
<text x="1060.0" y="863" font-size="12" font-weight="400">  y doblar la tabla/flex (masonite) por ellos.</text>
